id = "herdr-smart-nav"
name = "Smart Nav"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Seamless Ctrl-h/j/k/l navigation across Neovim splits and herdr panes."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "nav_left"
title = "Move left across Neovim splits and herdr panes"
command = ["./target/release/herdr-smart-nav", "left"]

[[actions]]
id = "nav_down"
title = "Move down across Neovim splits and herdr panes"
command = ["./target/release/herdr-smart-nav", "down"]

[[actions]]
id = "nav_up"
title = "Move up across Neovim splits and herdr panes"
command = ["./target/release/herdr-smart-nav", "up"]

[[actions]]
id = "nav_right"
title = "Move right across Neovim splits and herdr panes"
command = ["./target/release/herdr-smart-nav", "right"]
